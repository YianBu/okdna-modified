<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="p1" x1="16" y1="14" x2="48" y2="52">
      <stop stop-color="#8FDCC0"/>
      <stop offset="1" stop-color="#1E7A5A"/>
    </linearGradient>
  </defs>

  <!-- lyre: left horn curling outward -->
  <path d="M24.5 48 C 15.5 43, 12.5 33.5, 16 25 C 18 20, 23 17, 28 18.6 C 29.8 19.2, 30.5 20.9, 29.5 22.2 C 28.6 23.4, 26.8 23.1, 26.2 21.8"
        fill="none" stroke="#2FA37A" stroke-width="2.3" stroke-linecap="round"/>
  <!-- right horn -->
  <path d="M39.5 48 C 48.5 43, 51.5 33.5, 48 25 C 46 20, 41 17, 36 18.6 C 34.2 19.2, 33.5 20.9, 34.5 22.2 C 35.4 23.4, 37.2 23.1, 37.8 21.8"
        fill="none" stroke="#2FA37A" stroke-width="2.3" stroke-linecap="round"/>
  <!-- yoke crossbar -->
  <path d="M18.5 26.5 H45.5" stroke="#2FA37A" stroke-width="2" stroke-linecap="round"/>

  <!-- strings: center + outer pair crossing like a double helix -->
  <path d="M32 27 V46" stroke="#2FA37A" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M25.5 27 C 28 34, 36 40, 38.5 46" fill="none" stroke="url(#p1)" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M38.5 27 C 36 34, 28 40, 25.5 46" fill="none" stroke="url(#p1)" stroke-width="1.6" stroke-linecap="round" opacity="0.55"/>
  <!-- tuning pegs on the yoke -->
  <circle cx="25.5" cy="26.5" r="1.4" fill="#2FA37A"/>
  <circle cx="32" cy="26.5" r="1.4" fill="#2FA37A"/>
  <circle cx="38.5" cy="26.5" r="1.4" fill="#2FA37A"/>
  <!-- gem at the crossing point -->
  <path d="M32 34 L34.2 37 L32 40 L29.8 37 Z" fill="#E8F7F1" stroke="#2FA37A" stroke-width="1.4" stroke-linejoin="round"/>

  <!-- soundbox / base -->
  <path d="M24 47.5 H40 L42 52 H22 Z" fill="#E8F7F1" stroke="#2FA37A" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M27 49.8 H37" stroke="#8FDCC0" stroke-width="1.2" stroke-linecap="round"/>

  <!-- sparkles -->
  <path d="M11 15.5 L11.9 17.8 L14.2 18.7 L11.9 19.6 L11 21.9 L10.1 19.6 L7.8 18.7 L10.1 17.8 Z" fill="#8FDCC0"/>
  <path d="M53 40.5 L53.9 42.8 L56.2 43.7 L53.9 44.6 L53 46.9 L52.1 44.6 L49.8 43.7 L52.1 42.8 Z" fill="#8FDCC0"/>
</svg>
