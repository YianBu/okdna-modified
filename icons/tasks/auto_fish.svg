<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="p1" x1="42" y1="18" x2="58" y2="46">
      <stop stop-color="#9CCBEC"/>
      <stop offset="1" stop-color="#1E5F94"/>
    </linearGradient>
  </defs>

  <!-- DOUBLE HELIX TAIL: two bold crossing strands -->
  <g stroke-linecap="round" fill="none">
    <path d="M42.5 26.5 C 50.5 25.5, 55.5 30, 57.5 40" stroke="url(#p1)" stroke-width="2.6"/>
    <path d="M42.5 37.5 C 50.5 38.5, 55.5 34, 57.5 24" stroke="url(#p1)" stroke-width="2.6" opacity="0.8"/>
    <path d="M49.5 26.2 C 51.5 28.5, 51.5 35.5, 49.5 37.8" stroke="url(#p1)" stroke-width="1.5" opacity="0.6"/>
  </g>
  <circle cx="57.5" cy="40" r="1.8" fill="#9CCBEC"/>
  <circle cx="57.5" cy="24" r="1.8" fill="#9CCBEC"/>

  <!-- dorsal fin -->
  <path d="M24 20.8 C 25 14.5, 32 12, 38.5 15 C 34.5 17, 31 19.5, 29.8 21.2 Z"
        fill="#EAF4FB" stroke="#2E86C9" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- streamlined body, tapering into the tail -->
  <path d="M9 32 C 13.5 24, 22.5 19.5, 31 20.5 C 36.5 21.2, 41.5 24.5, 42.8 28.5 C 43.4 30.5, 43.4 33.5, 42.8 35.5 C 41.5 39.5, 36.5 42.8, 31 43.5 C 22.5 44.5, 13.5 40, 9 32 Z"
        fill="#FFFFFF" stroke="#2E86C9" stroke-width="2" stroke-linejoin="round"/>
  <!-- back highlight -->
  <path d="M13.5 27 C 17.5 23.5, 23 21.5, 29 22" fill="none" stroke="#9CCBEC" stroke-width="1.3" opacity="0.8"/>
  <!-- gill -->
  <path d="M22.5 25.5 C 21 29.5, 21 34.5, 22.5 38.5" fill="none" stroke="#9CCBEC" stroke-width="1.2" opacity="0.8"/>
  <!-- scale arcs -->
  <path d="M29 27.5 C 31 29.5, 31 33, 29 35.5" fill="none" stroke="#9CCBEC" stroke-width="1.2" opacity="0.7"/>
  <path d="M34 28.5 C 35.6 30.2, 35.6 32.8, 34 34.5" fill="none" stroke="#9CCBEC" stroke-width="1.2" opacity="0.55"/>
  <!-- eye: simple dot style -->
  <circle cx="17" cy="29.8" r="1.9" fill="#2E86C9"/>
  <circle cx="16.4" cy="29.2" r="0.55" fill="#FFFFFF"/>

  <!-- bubbles -->
  <circle cx="12.5" cy="23" r="1.4" fill="none" stroke="#9CCBEC" stroke-width="1.1"/>
  <circle cx="10" cy="18.5" r="1" fill="none" stroke="#9CCBEC" stroke-width="1" opacity="0.8"/>
  <circle cx="13.5" cy="14.5" r="0.7" fill="#9CCBEC"/>

  <!-- waves -->
  <path d="M11 50 C 15.5 47.5, 20 47.5, 24.5 50 C 29 52.5, 33.5 52.5, 38 50 C 42.5 47.5, 47 47.5, 51 49.5" fill="none" stroke="#9CCBEC" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/>
  <path d="M16 55 C 20 53, 24 53, 28 55 C 32 57, 36 57, 40 55" fill="none" stroke="#9CCBEC" stroke-width="1.3" stroke-linecap="round" opacity="0.55"/>
</svg>
