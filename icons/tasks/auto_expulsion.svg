<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">

  <!-- burst cube: isometric crate cracking open -->
  <!-- top face -->
  <path d="M32 13 L45 20 L32 27 L19 20 Z" fill="#FEF6F5" stroke="#D0453E" stroke-width="2" stroke-linejoin="round"/>
  <!-- left face -->
  <path d="M19 20 L32 27 L32 46 L19 38 Z" fill="#FFFFFF" stroke="#D0453E" stroke-width="2" stroke-linejoin="round"/>
  <!-- right face -->
  <path d="M45 20 L32 27 L32 46 L45 38 Z" fill="#FCEEED" stroke="#D0453E" stroke-width="2" stroke-linejoin="round"/>
  <!-- inner energy slits (glow vents) -->
  <g stroke="#D0453E" stroke-width="2.4" stroke-linecap="round">
    <path d="M24 29 V34 M28.5 31.5 V36.5" opacity="0.85"/>
    <path d="M38 31.5 V28.5 M42 36.5 V33.5" opacity="0.6"/>
  </g>
  <g stroke="#EFA5A1" stroke-width="1.3" stroke-linecap="round" opacity="0.8">
    <path d="M24 36 V38.5 M28.5 39 V41.5"/>
  </g>
  <!-- energy flash from the opening seam -->
  <path d="M32 27 L32 12" stroke="#EFA5A1" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <!-- flying shards (aligned along burst diagonals) -->
  <g fill="#FFFFFF" stroke="#D0453E" stroke-width="1.4" stroke-linejoin="round">
    <path d="M14.5 13.5 L19 12 L16.5 16.5 Z"/>
    <path d="M49.5 12 L54 13.5 L52 18 Z"/>
    <path d="M52.5 33.5 L56 31 L55.5 35.5 Z"/>
    <path d="M9 31.5 L13 30 L11.5 34.5 Z"/>
  </g>
  <g fill="#EFA5A1">
    <circle cx="24" cy="9" r="1.1"/>
    <circle cx="42" cy="8.5" r="1.1"/>
    <circle cx="8.5" cy="39" r="1.1"/>
    <circle cx="56.5" cy="41.5" r="1.1"/>
  </g>
  <!-- motion arcs -->
  <path d="M12.5 21.5 C 14.5 23, 15.5 24.5, 16 26.5" fill="none" stroke="#EFA5A1" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <path d="M51.5 21.5 C 50 23, 49 24.5, 48.5 26.5" fill="none" stroke="#EFA5A1" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
</svg>
