<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="p1" x1="20" y1="16" x2="44" y2="50">
      <stop stop-color="#F2C979"/>
      <stop offset="1" stop-color="#A85F14"/>
    </linearGradient>
  </defs>

  <!-- temple arch, wide -->
  <path d="M17 53 V30 C17 19.5, 23.5 13, 32 13 C40.5 13, 47 19.5, 47 30 V53"
        fill="none" stroke="#D98F2B" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M21 53 V31 C21 23, 25 17.5, 32 17" fill="none" stroke="#F2C979" stroke-width="1" opacity="0.8"/>
  <!-- arch finial -->
  <path d="M32 6.5 L33.5 9.5 L32 12.5 L30.5 9.5 Z" fill="#FBF3E4" stroke="#D98F2B" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M32 12.5 V13" stroke="#D98F2B" stroke-width="1.4" stroke-linecap="round"/>

  <!-- crescent moon crowning the pillar -->
  <path d="M36.5 16.5 A 6 6 0 1 0 36.5 27 A 7.5 7.5 0 1 1 36.5 16.5 Z"
        fill="#FBF3E4" stroke="#D98F2B" stroke-width="1.7" stroke-linejoin="round" transform="rotate(-16 32 21.8)"/>
  <path d="M24 20.5 L24.8 22.5 L26.8 23.3 L24.8 24.1 L24 26.1 L23.2 24.1 L21.2 23.3 L23.2 22.5 Z" fill="#F2C979"/>
  <path d="M42 28.5 L42.6 30 L44.1 30.6 L42.6 31.2 L42 32.7 L41.4 31.2 L39.9 30.6 L41.4 30 Z" fill="#F2C979"/>

  <!-- upright double helix moon-pillar inside the arch -->
  <g stroke-linecap="round" fill="none">
    <path d="M32 31.5 C 26 34.5, 26 38, 32 40.5 C 38 43, 38 46.5, 32 49.5" stroke="url(#p1)" stroke-width="2"/>
    <path d="M32 31.5 C 38 34.5, 38 38, 32 40.5 C 26 43, 26 46.5, 32 49.5" stroke="url(#p1)" stroke-width="2" opacity="0.5"/>
    <path d="M27.5 34.5 L36.5 34.5" stroke="#F2C979" stroke-width="1.4"/>
    <path d="M27.5 43 L36.5 43" stroke="#F2C979" stroke-width="1.4"/>
  </g>
  <circle cx="32" cy="31.5" r="1.3" fill="#D98F2B"/>

  <!-- base / steps -->
  <path d="M17 53 H47 M22.5 56.5 H41.5" stroke="#D98F2B" stroke-width="1.8" stroke-linecap="round"/>
</svg>
