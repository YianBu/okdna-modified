<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="p1" x1="16" y1="10" x2="48" y2="54">
      <stop stop-color="#A5AEE8"/>
      <stop offset="1" stop-color="#3A4698"/>
    </linearGradient>
  </defs>

  <!-- diamond cage frame -->
  <path d="M32 9 L53 32 L32 55 L11 32 Z" fill="#FFFFFF" stroke="#5260C8" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M32 14.5 L48 32 L32 49.5 L16 32 Z" fill="none" stroke="#A5AEE8" stroke-width="0.9" opacity="0.75"/>
  <!-- vertex gems (E / W) removed: struts meet the corners cleanly -->

  <!-- struts from vertices to the core -->
  <!-- N & S struts: twisted double strands (helix cage) -->
  <g stroke-linecap="round" fill="none">
    <path d="M32 14.5 C 29 17.5, 29 20.5, 32 23" stroke="url(#p1)" stroke-width="1.8"/>
    <path d="M32 14.5 C 35 17.5, 35 20.5, 32 23" stroke="url(#p1)" stroke-width="1.8" opacity="0.5"/>
    <path d="M30.5 18.7 L33.5 18.7" stroke="#A5AEE8" stroke-width="1.3"/>
    <path d="M32 49.5 C 29 46.5, 29 43.5, 32 41" stroke="url(#p1)" stroke-width="1.8"/>
    <path d="M32 49.5 C 35 46.5, 35 43.5, 32 41" stroke="url(#p1)" stroke-width="1.8" opacity="0.5"/>
    <path d="M30.5 45.3 L33.5 45.3" stroke="#A5AEE8" stroke-width="1.3"/>
    <!-- E & W struts: single lines -->
    <path d="M16 32 H23 M41 32 H48" stroke="#5260C8" stroke-width="1.8"/>
  </g>

  <!-- radiant core (warm glow) -->
  <circle cx="32" cy="32" r="6.5" fill="#FFF9EE" stroke="#D98F2B" stroke-width="1.8"/>
  <circle cx="32" cy="32" r="2" fill="#D98F2B"/>
  <g stroke="#D98F2B" stroke-width="1.4" stroke-linecap="round">
    <path d="M32 22.5 V20 M32 41.5 V44"/>
    <path d="M26.7 26.7 L24.9 24.9 M37.3 26.7 L39.1 24.9 M26.7 37.3 L24.9 39.1 M37.3 37.3 L39.1 39.1" opacity="0.8"/>
  </g>
  <!-- glow particles between rays -->
  <circle cx="32" cy="32" r="11.5" fill="none" stroke="#D98F2B" stroke-width="1.2" stroke-dasharray="0.1 6" stroke-linecap="round" opacity="0.6" transform="rotate(22.5 32 32)"/>
</svg>
